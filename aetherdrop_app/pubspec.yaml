name: aetherdrop_app
description: "AetherDrop — Cross-platform zero-cost Peer-to-Peer (P2P) ultra-fast file, folder, text, and clipboard transfer application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_webrtc: ^0.12.0
  file_picker: ^8.1.0
  desktop_drop: ^0.5.0
  super_clipboard: ^0.8.0
  path_provider: ^2.1.4
  path: ^1.9.0
  archive: ^3.6.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.3.3
  crypto: ^3.0.6
  flutter_animate: ^4.5.0
  window_manager: ^0.4.2
  lucide_icons_flutter: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
